name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Stage web app in Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html style.css app.js android/app/src/main/assets/
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingua-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view lingua-v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload lingua-v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create lingua-v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lingua Android v1.0.0" \
              --notes "Installable Android APK built from commit $GITHUB_SHA." \
              --target "$GITHUB_SHA"
          fi
